<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dress packing list</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece9f0; --surface:#fff; --ink:#1d1630; --muted:#6a6279; --line:#d9d3e3;
  --accent:#a3205f; --accent-ink:#fff; --danger:#b3261e; --soft:#f5f2f8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#150f20;--surface:#211832;--ink:#f1ecf8;--muted:#a79cb8;--line:#372b4d;--accent:#ff6fb0;--accent-ink:#2a0618;--danger:#ff8a80;--soft:#2a2040}
}
:root[data-theme="dark"]{--bg:#150f20;--surface:#211832;--ink:#f1ecf8;--muted:#a79cb8;--line:#372b4d;--accent:#ff6fb0;--accent-ink:#2a0618;--danger:#ff8a80;--soft:#2a2040}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:18px 14px 150px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0 0 14px;font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number]{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 10px;width:100%;min-width:0}
.wide{grid-column:1 / -1}

.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.bh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--accent);color:var(--accent-ink)}
.bh b{font-size:1.2rem;font-weight:800}
.bh span{font-weight:600}
.bh button{border:0;background:transparent;color:inherit;font-size:1.5rem;width:40px;height:40px;cursor:pointer;margin-right:-8px}
.bb{padding:12px 14px 14px}
.cols,.row{display:grid;grid-template-columns:1fr 104px 64px 36px;gap:6px;align-items:center}
.cols{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:4px;padding-right:0}
.row{margin-bottom:6px}
.row input{height:44px;padding:0 8px}
.row input.c{text-align:center}
.x{border:0;background:transparent;color:var(--muted);font-size:1.4rem;height:44px;cursor:pointer}
.x:hover{color:var(--danger)}
select{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 4px;width:100%;min-width:0;font:inherit;color:inherit}
.row select{height:44px}
.none{color:var(--muted);text-align:center;padding:10px 0 4px;font-size:.92rem}
.kgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:8px 10px;background:var(--soft);border-radius:10px;font-weight:600}
.kgrow input{width:110px;height:44px;text-align:center}
.adder{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.adder .t{font-weight:800;margin-bottom:8px}
.arow{display:grid;grid-template-columns:1fr 104px 64px;gap:6px}
.arow label{display:flex;flex-direction:column;gap:3px;min-width:0}
.arow label span{font-size:.78rem;color:var(--muted);font-weight:600}
.arow input{padding:0 8px}
.arow input.c{text-align:center}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;padding:0 16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.adder .btn{width:100%;margin-top:10px}
#addbox{width:100%;height:54px;font-size:1.05rem;border-style:dashed;border-width:2px;color:var(--accent);font-weight:800}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:640px;margin:0 auto}
.tot{display:flex;text-align:center;margin-bottom:8px}
.tot div{flex:1}
.tot b{display:block;font-size:1.3rem;font-weight:800}
.tot span{font-size:.75rem;color:var(--muted)}
.acts{display:flex;gap:8px}.acts .btn{flex:1;height:44px;padding:0;font-size:.85rem}
[hidden]{display:none!important}
input[type=text]{text-transform:uppercase}
input[data-nocaps]{text-transform:none}
input[type=password]{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 10px;width:100%;min-width:0}
.top{display:flex;gap:8px;margin-bottom:12px}
.top .btn{height:40px;font-size:.9rem;padding:0 14px}
.asub{color:var(--muted);margin:-6px 0 12px}
.adm{display:flex;gap:8px;margin-bottom:12px}.adm .btn{flex:1}
.adm .btn:disabled{opacity:.5}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.rt{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.rm{color:var(--muted);font-size:.9rem}
.ra{display:flex;gap:8px;margin-top:10px}.ra .btn{flex:1;height:42px;padding:0}
.ra .del{color:var(--danger)}
.lg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.lgbox{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lgbox h2{margin:0}
.lgbox .err{color:var(--danger);margin:0;min-height:1.2em;font-size:.9rem}
.acts2{display:flex;gap:8px}.acts2 .btn{flex:1}
.addl{width:100%;height:44px;margin-top:6px;border-style:dashed;color:var(--accent);font-weight:800}
#szs,#pfs{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
.szp{background:var(--surface);border-radius:16px;width:100%;max-width:420px;max-height:62vh;display:flex;flex-direction:column;gap:10px;padding:12px}
.szh{display:flex;justify-content:space-between;align-items:center}.szh b{font-size:1.1rem}.szh .btn{height:38px;padding:0 14px}
.szl{overflow-y:auto;display:flex;flex-direction:column}
.szo{min-height:50px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 8px;font-weight:600;cursor:pointer;font-size:1rem}
.szo.use{color:var(--accent);font-weight:800}
input.dd{cursor:pointer;padding-right:20px!important;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23888%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 7px center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}

#pt{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  main>*:not(#pt),.bar,.toast{display:none!important}
  main{padding:0;max-width:none}
  #pt{display:block}
  #pt h2{margin:0 0 6px;font-size:20px}
  #pt .meta{display:flex;gap:30px;margin-bottom:12px;font-size:14px}
  #pt table{width:100%;border-collapse:collapse}
  #pt th,#pt td{border:1px solid #000;padding:4px 8px;text-align:left}
  #pt .n{text-align:right}
  #pt .sub td{font-weight:800;background:#eee}
  #pt tfoot td{font-weight:800}
  #pt tr{break-inside:avoid}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>
<main>
  <div class="top"><button id="pfbtn" class="btn" type="button" style="max-width:60vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Profile: <b id="pfname"></b> &#9662;</button><button id="login" class="btn" type="button">Login</button><button id="logout" class="btn" type="button" hidden>Logout</button></div>
  <div id="app">
  <h1>Packing list</h1><p class="asub">Saved on this phone as you type</p>
  <section class="panel">
    <div class="grid2">
      <label class="f wide"><span>Customer name</span><input id="cust" type="text" autocomplete="organization" placeholder="Who is this shipment for?"></label>
      <label class="f wide"><span>Date</span><input id="date" type="date"></label>
    </div>
  </section>

  <div id="boxes"></div>
  <button id="addbox" class="btn" type="button">+ Add another box</button>
  </div>
  <div id="admin" hidden>
    <h1>Admin panel</h1>
    <p class="asub">All saved packing lists</p>
    <div class="adm"><button id="dlall" class="btn pri" type="button">Download all</button><button id="refresh" class="btn" type="button">Refresh</button></div>
    <div id="saved"></div>
    <h1 style="font-size:1.3rem;margin-top:22px">Style names</h1><p class="asub">Suggested to everyone when typing a style name</p>
    <div class="adm" style="gap:6px"><input id="stynew" type="text" placeholder="Add a style name" style="flex:2"><button id="styaddbtn" class="btn pri" type="button">Add</button></div>
    <div class="adm"><button id="styimp" class="btn" type="button">Import from saved lists</button></div>
    <div id="stybox"></div>
  </div>
  <div id="pt" aria-hidden="true"></div>
</main>

<div class="bar" id="bar"><div class="bar-in">
  <div class="tot"><div><b id="tb">0</b><span>Boxes</span></div><div><b id="tp">0</b><span>Total pieces</span></div><div><b id="tk">0</b><span>Total kg</span></div></div>
  <button id="share" class="btn pri" type="button" hidden style="width:100%;height:46px;margin-bottom:8px">Share</button><div class="acts"><button id="save" class="btn pri" type="button">Save list</button><button id="print" class="btn" type="button">Print</button><button id="reset" class="btn" type="button">New</button></div>
</div></div>
<div id="szs" class="szs" hidden><div class="szp"><div class="szh"><b>Choose size</b><button id="szx" type="button" class="btn">Close</button></div>
<input id="szq" type="text" placeholder="Search or type a custom size" autocomplete="off" enterkeyhint="done">
<div id="szl" class="szl"></div></div></div>
<div id="pfs" hidden><div class="szp"><div class="szh"><b>Profiles</b><button id="pfx" type="button" class="btn">Close</button></div><div id="pfl" class="szl"></div><button id="pfadd" type="button" class="btn addl">+ New profile</button></div></div>
<datalist id="sizelist"></datalist>
<datalist id="stylelist"></datalist>
<div id="lg" class="lg" hidden><div class="lgbox"><h2>Admin login</h2>
<label class="f"><span>Username</span><input id="lguser" type="text" data-nocaps autocomplete="username" autocapitalize="none" spellcheck="false"></label>
<label class="f"><span>Password</span><input id="lgpass" type="password" autocomplete="current-password"></label>
<p id="lgerr" class="err" role="alert"></p>
<div class="acts2"><button id="lgcancel" class="btn" type="button">Cancel</button><button id="lgok" class="btn pri" type="button">Log in</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="dress-boxes-v1",PK="dress-profiles-v1",PD="dress-draft-v1-",PF={cur:"",list:[]};
  function pfSave(){try{localStorage.setItem(PK,JSON.stringify(PF))}catch(e){}}
  function pfName(){var n="";PF.list.forEach(function(p){if(p.id===PF.cur)n=p.name});return n}
  function pfLoad(){
    if(pfLoad.done){KEY=PD+PF.cur;return}
    pfLoad.done=1;
    try{var r=JSON.parse(localStorage.getItem(PK));if(r&&Array.isArray(r.list)&&r.list.length)PF=r}catch(e){}
    if(!PF.list.length){PF={cur:"p1",list:[{id:"p1",name:"PROFILE 1"}]};try{var old=localStorage.getItem(KEY);if(old)localStorage.setItem(PD+"p1",old)}catch(e){}pfSave()}
    if(!PF.list.some(function(p){return p.id===PF.cur}))PF.cur=PF.list[0].id;
    KEY=PD+PF.cur;
  }
  var S={cust:"",date:"",boxes:[]};
  var draft={};
  function $(i){return document.getElementById(i)}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function qn(v){var n=parseInt(v,10);return n>0?n:0}
  function load(){pfLoad();try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.boxes)){S=s}}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!save.w){save.w=1;toast("Cannot save on this phone. Turn off private mode")}}}
  function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},1800)}
  function boxTotal(b){return b.items.reduce(function(a,i){return a+qn(i.qty)},0)}
  function boxKg(b){var n=parseFloat(b.kg);return n>0?Math.round(n*100)/100:0}
  function totals(){
    var p=0,k=0;S.boxes.forEach(function(b){var t=boxTotal(b),w=boxKg(b);p+=t;k+=w;var e=document.querySelector('[data-bt="'+b.id+'"]');if(e)e.textContent=t+" pcs"+(w?" \u00b7 "+w+" kg":"")});
    $("tb").textContent=S.boxes.length;$("tp").textContent=p;$("tk").textContent=Math.round(k*100)/100;
  }
  function inp(cls,val,ph,mode,label){
    var i=document.createElement("input");i.type="text";i.className=cls||"";i.value=val==null?"":val;
    if(ph)i.placeholder=ph;if(mode)i.setAttribute("inputmode",mode);if(label)i.setAttribute("aria-label",label);return i;
  }
  var SIZES=["S","M","L","XL","2XL","3XL","S/M/L","S/M/L/XL","XL/XXL","S/M","M/L","L/XL","S/M,M/L"];
  function sel(val,label,cb){
    var s=document.createElement("input");s.type="text";s.readOnly=true;s.className="c dd";s.setAttribute("inputmode","none");s.setAttribute("aria-label",label);s.setAttribute("autocomplete","off");s.placeholder="Size";s.onclick=function(){openSizes(s.value,function(v){s.value=v;cb(v)})};
    
    
    
    s.value=val||"";return s;
  }
  function fillList(){var dl=$("sizelist");if(!dl)return;var seen={},out=[];SIZES.forEach(function(z){seen[z]=1;out.push(z)});S.boxes.forEach(function(b){b.items.forEach(function(i){if(i.size&&!seen[i.size]){seen[i.size]=1;out.push(i.size)}})});dl.innerHTML="";out.forEach(function(z){var o=document.createElement("option");o.value=z;dl.appendChild(o)})}
  function blank(){return {id:uid(),style:"",size:"",qty:""}}
  function nonEmpty(i){return !!(String(i.style||"").trim()||String(i.size||"").trim()||qn(i.qty))}
  function newBox(){S.boxes.push({id:uid(),items:[blank(),blank(),blank(),blank()]})}

  function render(){
    fillList();S.boxes.forEach(function(b){while(b.items.length<4)b.items.push(blank())});var wrap=$("boxes");wrap.innerHTML="";
    S.boxes.forEach(function(b,bi){
      
      var box=document.createElement("section");box.className="box";box.id="box-"+b.id;
      var h=document.createElement("div");h.className="bh";
      var t=document.createElement("b");t.textContent="Box "+(bi+1);
      var c=document.createElement("span");c.setAttribute("data-bt",b.id);
      h.appendChild(t);h.appendChild(c);
      if(S.boxes.length>1){
        var del=document.createElement("button");del.type="button";del.textContent="\u00d7";del.setAttribute("aria-label","Delete box "+(bi+1));
        del.onclick=function(){if(!b.items.length||confirm("Delete Box "+(bi+1)+" and its items?")){S.boxes.splice(bi,1);save();render()}};
        h.appendChild(del);
      }
      box.appendChild(h);
      var body=document.createElement("div");body.className="bb";

      if(b.items.length){
        var cols=document.createElement("div");cols.className="cols";
        cols.innerHTML="<span>Style name</span><span>Size</span><span>Qty</span><span></span>";
        body.appendChild(cols);
        b.items.forEach(function(it,ii){
          var r=document.createElement("div");r.className="row";
          var a=inp("",it.style,"","","Style name");a.setAttribute("list","stylelist");a.setAttribute("autocomplete","off");a.oninput=function(){it.style=a.value;save()};
          var s=sel(it.size,"Size",function(v){it.size=v;save()});
          var q=inp("c",it.qty,"","numeric","Quantity");q.oninput=function(){it.qty=q.value.replace(/\D/g,"");if(q.value!==it.qty)q.value=it.qty;save();totals()};
          var x=document.createElement("button");x.type="button";x.className="x";x.textContent="\u00d7";x.setAttribute("aria-label","Delete item");
          x.onclick=function(){b.items.splice(ii,1);save();render()};
          r.appendChild(a);r.appendChild(s);r.appendChild(q);r.appendChild(x);body.appendChild(r);
        });
      }else{
        var n=document.createElement("div");n.className="none";n.textContent="This box is empty. Add the first item below.";body.appendChild(n);
      }

      var addl=document.createElement("button");addl.type="button";addl.className="btn addl";addl.textContent="+ Add line";
      addl.onclick=function(){b.items.push(blank());save();render()};
      body.appendChild(addl);
      var kr=document.createElement("label");kr.className="kgrow";var ks=document.createElement("span");ks.textContent="Box weight (kg)";
      var ki=inp("c",b.kg,"0","decimal","Box weight in kg");ki.oninput=function(){b.kg=ki.value.replace(/[^0-9.]/g,"");if(ki.value!==b.kg)ki.value=b.kg;save();totals()};
      kr.appendChild(ks);kr.appendChild(ki);body.appendChild(kr);

      box.appendChild(body);wrap.appendChild(box);
    });
    totals();
  }

  $("addbox").onclick=function(){
    newBox();save();render();
    var last=S.boxes[S.boxes.length-1];var e=$("box-"+last.id);
    if(e)e.scrollIntoView({behavior:"smooth",block:"start"});
  };
  $("cust").oninput=function(e){S.cust=e.target.value;save()};
  $("date").oninput=function(e){S.date=e.target.value;save()};
  $("reset").onclick=function(){
    if(!confirm("Start a new list? This clears all boxes and items."))return;$("share").hidden=true;
    S={cust:"",date:today(),boxes:[]};newBox();draft={};
    $("cust").value="";$("date").value=S.date;save();render();window.scrollTo(0,0);
  };

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function colW(r){
    var A=8,B=32,C=14,D=12;
    r.boxes.forEach(function(b){
      var k=boxKg(b);if(k)D=Math.max(D,String(k+" KG").length*1.7+3);
      (b.items||[]).forEach(function(i){
        B=Math.max(B,String(i.style||"").length*1.3+4);
        C=Math.max(C,String(i.size||"").length*1.3+4)})});
    return [A,Math.min(B,70),Math.min(C,30),Math.min(D,24)]}
  function buildPrint(){
    var BD="border:0.75pt solid #8a8a8a;",PINK="#a3205f",SOFT="#f3e3ec",GREY="#ededed";
    function td(txt,o){o=o||{};
      return '<td'+(o.span?' colspan="'+o.span+'"':'')+' style="'+(o.nb?'':BD)+'width:'+(o.w||"auto")+';padding:'+(o.pad||"5pt 6pt")+';font-size:'+(o.sz||11)+'pt;'+(o.b?'font-weight:bold;':'')+(o.i?'font-style:italic;':'')+(o.bg?'background-color:'+o.bg+';':'')+(o.c?'color:'+o.c+';':'')+'text-align:'+(o.h||"left")+';">'+txt+'</td>'}
    function tot(label,val,bg,sz){return '<tr>'+td(label,{span:3,b:1,h:"right",bg:bg,sz:sz})+td(val,{b:1,h:"center",bg:bg,sz:sz,w:W[3]})+'</tr>'}
    function gap(){return '<tr>'+td('&nbsp;',{span:4,nb:1,sz:6,pad:"0"})+'</tr>'}
    var r=recNow(),cw=colW(r),tw=cw[0]+cw[1]+cw[2]+cw[3];
    var TP=Math.min(100,Math.max(72,Math.round(tw/66*72)));
    var W=cw.map(function(x){return (x/tw*100).toFixed(2)+"%"});
    var h='<table style="width:'+TP+'%;border-collapse:collapse;">'
      +'<tr>'+W.map(function(w){return td('&nbsp;',{nb:1,w:w,sz:1,pad:"0"})}).join("")+'</tr>'
      +'<tr>'+td('PACKING LIST',{span:4,nb:1,b:1,sz:18,h:"center",pad:"4pt 6pt"})+'</tr>'
      +'<tr>'+td('CUSTOMER:&nbsp; '+esc(r.cust),{span:4,nb:1,b:1,sz:12})+'</tr>'
      +'<tr>'+td('DATE:&nbsp; '+esc(r.date),{span:4,nb:1,b:1,sz:12})+'</tr>'+gap();
    r.boxes.forEach(function(b,bi){
      var kg=boxKg(b),t=0;
      h+='<tr>'+td('BOX NO. '+(bi+1),{span:3,b:1,sz:18,c:"#ffffff",bg:PINK,pad:"7pt 6pt"})+td(kg?kg+' KG':'',{b:1,sz:14,c:"#ffffff",bg:PINK,h:"center",w:W[3],pad:"7pt 6pt"})+'</tr>';

  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save()});
  window.addEventListener("pagehide",save);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!S.date)S.date=today();
  $("cust").value=S.cust||"";$("date").value=S.date;
  render();
})();
</script>
</body>
