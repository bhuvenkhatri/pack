<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Stepper</title>
<style>
:root{--bg:#f3f1ee;--surface:#fff;--ink:#1c1b1a;--muted:#6b6862;--line:#d9d5ce;--accent:#1f5fd6;--accent-ink:#fff;--stage:#0d0d0e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141415;--surface:#1e1e20;--ink:#ececea;--muted:#9a9791;--line:#333336;--accent:#6b9bff;--accent-ink:#0b1020;--stage:#000}}
:root[data-theme="dark"]{--bg:#141415;--surface:#1e1e20;--ink:#ececea;--muted:#9a9791;--line:#333336;--accent:#6b9bff;--accent-ink:#0b1020;--stage:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Inter","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px;font-weight:650;letter-spacing:-.01em}
#stage{position:relative;background:var(--stage);border-radius:10px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
video{display:block;max-width:100%;max-height:60vh;width:100%}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfcfd2;text-align:center;padding:20px;border:2px dashed #55555a;border-radius:10px;margin:8px;cursor:pointer}
#drop.over{border-color:var(--accent);color:#fff}
#drop.hide{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
#readout{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-bottom:8px}
#readout b{font-size:22px;font-weight:650}
#readout span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button,select,.btn{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.grow{flex:1}
label{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
#msg{color:#c43b2b;font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<main>
<h1>Frame Stepper</h1>
<div id="stage">
  <video id="v" playsinline muted preload="auto"></video>
  <div id="drop" tabindex="0" role="button" aria-label="Choose a video file">
    <strong>Drop a video here or tap to choose one</strong>
    <span style="font-size:13px">Plays whatever your browser can decode (MP4, WebM, MOV, OGG…). Nothing is uploaded.</span>
  </div>
</div>
<div id="msg" role="status"></div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.m4v,.3gp,.ogv" hidden>

<div class="panel">
  <div id="readout"><div><b id="frameNo">0</b> <span>/ <span id="frameTot">0</span> frames</span></div><div><span id="timeNo">0:00.000</span> / <span id="durNo">0:00.000</span></div></div>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <div class="row">
    <button id="toStart" title="First frame">⏮</button>
    <button id="back10" title="Back 10 frames">−10</button>
    <button id="back" title="Previous frame (←)">◀ Frame</button>
    <button id="play" class="primary" title="Play/Pause (Space)">Play</button>
    <button id="fwd" title="Next frame (→)">Frame ▶</button>
    <button id="fwd10" title="Forward 10 frames">+10</button>
    <button id="toEnd" title="Last frame">⏭</button>
  </div>
  <div class="row">
    <label for="fps">Frame rate</label>
    <select id="fps">
      <option value="23.976">23.976</option><option value="24">24</option><option value="25">25</option>
      <option value="29.97">29.97</option><option value="30" selected>30</option><option value="48">48</option>
      <option value="50">50</option><option value="59.94">59.94</option><option value="60">60</option><option value="120">120</option>
    </select>
    <button id="detect" title="Plays a moment to measure the real frame rate">Detect</button>
    <label for="speed">Speed</label>
    <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
    <span class="grow"></span>
    <button id="open">Open another</button>
  </div>
  <div class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> step · hold to scrub · <kbd>Shift</kbd>+arrow ×10 · <kbd>Space</kbd> play · <kbd>Home</kbd>/<kbd>End</kbd></div>
</div>
</main>
<script>
(function(){
var v=document.getElementById('v'),$=function(i){return document.getElementById(i)};
var fps=30,loaded=false,url=null,holdT=null;
function fmt(t){if(!isFinite(t))t=0;var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(3)}
function frameOf(t){return Math.floor(t*fps+1e-4)}
function total(){return isFinite(v.duration)?Math.max(1,Math.round(v.duration*fps)):0}
function ui(){
  $('frameNo').textContent=frameOf(v.currentTime);$('frameTot').textContent=total();
  $('timeNo').textContent=fmt(v.currentTime);$('durNo').textContent=fmt(v.duration);
  if(v.duration)$('seek').value=Math.round(v.currentTime/v.duration*1000);
  $('play').textContent=v.paused?'Play':'Pause';
}
function goFrame(n){
  if(!loaded)return;v.pause();
  var max=Math.max(0,total()-1);n=Math.min(max,Math.max(0,n));
  v.currentTime=Math.min(v.duration,(n+0.5)/fps);
}
function step(d){goFrame(frameOf(v.currentTime)+d)}
var curFile=null,retried=false;
function load(f){
  if(!f)return;
  curFile=f;retried=false;loaded=false;
  $('msg').textContent='Loading…';
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);v.src=url;v.load();
  $('drop').classList.add('hide');
}
v.addEventListener('loadedmetadata',function(){loaded=true;$('msg').textContent='';v.playbackRate=+$('speed').value;ui();autoFps()});
v.addEventListener('error',function(){
  loaded=false;
  if(curFile&&!retried){
    retried=true;$('msg').textContent='Retrying another way…';
    var r=new FileReader();
    r.onload=function(){v.src=r.result;v.load()};
    r.onerror=function(){showErr()};
    r.readAsDataURL(curFile);
    return;
  }
  showErr();
});
function showErr(){
  $('drop').classList.remove('hide');
  var c=v.error?v.error.code:'?',t=curFile?(curFile.type||'unknown type'):'';
  $('msg').textContent='Could not play this file (error '+c+', '+t+'). If you are viewing this inside the Claude app, download the HTML file and open it in Safari or Chrome instead; otherwise convert the video to MP4 (H.264).';
}
['timeupdate','seeked','play','pause','ended'].forEach(function(e){v.addEventListener(e,ui)});
if('requestVideoFrameCallback' in v){(function loop(){v.requestVideoFrameCallback(function(){ui();loop()})})()}

// FPS detection: sample media-time deltas while playing briefly
function autoFps(){
  if(!('requestVideoFrameCallback' in v))return;
  var last=null,d=[],start=v.currentTime,n=0;
  v.muted=true;v.playbackRate=1;
  function cb(now,meta){
    if(last!==null&&meta.mediaTime>last)d.push(meta.mediaTime-last);
    last=meta.mediaTime;
    if(++n<24){v.requestVideoFrameCallback(cb)}else finish();
  }
  function finish(){
    v.pause();v.currentTime=start;
    d.sort(function(a,b){return a-b});
    if(d.length>4){var med=d[Math.floor(d.length/2)],est=1/med;setFps(est)}
    v.playbackRate=+$('speed').value;
  }
  v.requestVideoFrameCallback(cb);
  v.play().catch(function(){});
  setTimeout(function(){if(n<24&&!v.paused)finish()},2500);
}
function setFps(est){
  var opts=Array.prototype.map.call($('fps').options,function(o){return +o.value});
  var best=opts.reduce(function(a,b){return Math.abs(b-est)<Math.abs(a-est)?b:a});
  if(Math.abs(best-est)/best<0.04){fps=best;$('fps').value=String(best)}
  else{fps=est;var o=document.createElement('option');o.value=est;o.textContent=est.toFixed(3);o.selected=true;$('fps').appendChild(o)}
  ui();
}
$('detect').onclick=function(){if(!loaded)return;if('requestVideoFrameCallback' in v)autoFps();else $('msg').textContent='Detection is not supported in this browser. Pick the frame rate manually.'};
$('fps').onchange=function(){fps=+this.value;ui()};
$('speed').onchange=function(){v.playbackRate=+this.value};

// controls
$('play').onclick=function(){if(!loaded)return;v.paused?v.play():v.pause()};
$('back').onclick=function(){step(-1)};$('fwd').onclick=function(){step(1)};
$('back10').onclick=function(){step(-10)};$('fwd10').onclick=function(){step(10)};
$('toStart').onclick=function(){goFrame(0)};$('toEnd').onclick=function(){goFrame(total()-1)};
$('seek').oninput=function(){if(loaded){v.pause();v.currentTime=this.value/1000*v.duration}};
function hold(btn,d){
  var t,iv;
  function stop(){clearTimeout(t);clearInterval(iv)}
  btn.addEventListener('pointerdown',function(){t=setTimeout(function(){iv=setInterval(function(){step(d)},80)},400)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){btn.addEventListener(e,stop)});
}
hold($('back'),-1);hold($('fwd'),1);

document.addEventListener('keydown',function(e){
  if(/INPUT|SELECT/.test(e.target.tagName)&&e.target.type!=='range'&&e.key!==' ')return;
  if(e.target.tagName==='BUTTON'&&e.key===' ')return;
  var k=e.key;
  if(k==='ArrowRight'){e.preventDefault();step(e.shiftKey?10:1)}
  else if(k==='ArrowLeft'){e.preventDefault();step(e.shiftKey?-10:-1)}
  else if(k===' '){e.preventDefault();$('play').click()}
  else if(k==='Home'){e.preventDefault();goFrame(0)}
  else if(k==='End'){e.preventDefault();goFrame(total()-1)}
});

// file input + drop
var fi=$('file'),drop=$('drop'),stage=$('stage');
drop.onclick=function(){fi.click()};
drop.onkeydown=function(e){if(e.key==='Enter')fi.click()};
$('open').onclick=function(){fi.click()};
fi.onchange=function(){load(fi.files[0]);fi.value=''};
['dragenter','dragover'].forEach(function(e){stage.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(e){stage.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
stage.addEventListener('drop',function(ev){var f=ev.dataTransfer.files[0];if(f)load(f)});
})();
</script>
</body>
</html>
